<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adrective.Ai — IG Story Hype Trailer</title>
    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; cursor: none; }
        canvas { display: block; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            z-index: 10; background: rgba(0,0,0,0.85);
            transition: opacity 0.5s;
        }
        #startBtn {
            padding: 18px 48px;
            background: transparent;
            border: 1px solid rgba(196,30,42,0.4);
            color: rgba(245,245,247,0.8);
            font: 600 14px 'Orbitron', sans-serif;
            letter-spacing: 4px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
        }
        #startBtn:hover {
            border-color: rgba(196,30,42,0.9);
            background: rgba(196,30,42,0.08);
            box-shadow: 0 0 40px rgba(196,30,42,0.15);
        }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay"><button id="startBtn">Ignite</button></div>
<script>
'use strict';

const canvas = document.getElementById('c');
const gl = canvas.getContext('2d');

// ─── 9:16 VERTICAL LAYOUT ───
let W, H;
function resize() {
    const ratio = 9 / 16;
    if (window.innerWidth / window.innerHeight > ratio) {
        H = window.innerHeight;
        W = H * ratio;
    } else {
        W = window.innerWidth;
        H = W / ratio;
    }
    canvas.width = W;
    canvas.height = H;
    canvas.style.position = 'absolute';
    canvas.style.left = ((window.innerWidth - W) / 2) + 'px';
    canvas.style.top = ((window.innerHeight - H) / 2) + 'px';
}
resize();
window.addEventListener('resize', resize);

// ─── TIMING ───
// Total: ~22 seconds, 7 rapid scenes
const SCENES = [
    { s: 0,    d: 3.0 },   // 0: Dark spark ignition
    { s: 3.0,  d: 2.5 },   // 1: "THE FUTURE DOESN'T WAIT"
    { s: 5.5,  d: 3.0 },   // 2: Feature rapid-fire (3 callouts)
    { s: 8.5,  d: 3.0 },   // 3: Globe + worldwide connections
    { s: 11.5, d: 3.0 },   // 4: Data matrix rain
    { s: 14.5, d: 4.0 },   // 5: Logo slam + tagline
    { s: 18.5, d: 3.5 },   // 6: Hold + fade to black
];
const TOTAL_DUR = 22;

// ─── HELPERS ───
function clamp(v) { return Math.max(0, Math.min(1, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function fade(t, start, dur) { return clamp((t - start) / dur); }
function fadeO(t, start, dur) { return 1 - clamp((t - start) / dur); }
function fadeIO(p, inS, inD, outS, outD) { return Math.min(clamp((p - inS) / inD), 1 - clamp((p - outS) / outD)); }
function sp(t, si) { return clamp((t - SCENES[si].s) / SCENES[si].d); }
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOut(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }

// ─── PARTICLES ───
const PC = 1500;
const px = new Float32Array(PC), py = new Float32Array(PC);
const pvx = new Float32Array(PC), pvy = new Float32Array(PC);
const psz = new Float32Array(PC), pph = new Float32Array(PC);
for (let i = 0; i < PC; i++) {
    px[i] = (Math.random() - 0.5) * 2.5;
    py[i] = (Math.random() - 0.5) * 2.5;
    pvx[i] = (Math.random() - 0.5) * 0.003;
    pvy[i] = (Math.random() - 0.5) * 0.003;
    psz[i] = Math.random() * 1.8 + 0.3;
    pph[i] = Math.random() * Math.PI * 2;
}

// ─── GLITCH SYSTEM ───
let glitchIntensity = 0;
let glitchTimer = 0;
function triggerGlitch(intensity, duration) {
    glitchIntensity = intensity;
    glitchTimer = duration;
}

function drawGlitch(a) {
    if (glitchIntensity <= 0) return;
    const sliceCount = Math.floor(glitchIntensity * 12) + 3;
    for (let i = 0; i < sliceCount; i++) {
        const y = Math.random() * H;
        const h = Math.random() * 8 + 2;
        const shift = (Math.random() - 0.5) * W * 0.15 * glitchIntensity;
        const sliceData = gl.getImageData(0, Math.floor(y), W, Math.floor(h));
        gl.putImageData(sliceData, Math.floor(shift), Math.floor(y));
    }
    // Red/cyan chromatic split
    gl.globalCompositeOperation = 'screen';
    gl.fillStyle = `rgba(196,30,42,${a * glitchIntensity * 0.08})`;
    gl.fillRect(Math.random() * 6 - 3, 0, W, H);
    gl.fillStyle = `rgba(0,200,255,${a * glitchIntensity * 0.04})`;
    gl.fillRect(-(Math.random() * 6 - 3), 0, W, H);
    gl.globalCompositeOperation = 'source-over';
    // Scan lines
    for (let sy = 0; sy < H; sy += 3) {
        gl.fillStyle = `rgba(0,0,0,${glitchIntensity * 0.12})`;
        gl.fillRect(0, sy, W, 1);
    }
}

// ─── ALIVE LAYER — constant buzzing energy ───
function drawAliveLayer(t, a) {
    if (a < 0.01) return;
    // Edge sparks
    for (let i = 0; i < 8; i++) {
        const side = i % 4;
        const pos = Math.sin(t * 3.5 + i * 1.9) * 0.4 + 0.5;
        let sx, sy;
        if (side === 0) { sx = pos * W; sy = 0; }
        else if (side === 1) { sx = W; sy = pos * H; }
        else if (side === 2) { sx = pos * W; sy = H; }
        else { sx = 0; sy = pos * H; }
        const sparkA = (Math.sin(t * 7 + i * 2.3) * 0.5 + 0.5) * a;
        gl.beginPath(); gl.arc(sx, sy, 2, 0, Math.PI * 2);
        gl.fillStyle = `rgba(196,30,42,${sparkA * 0.6})`;
        gl.fill();
    }
    // Corner brackets
    const bS = 18, bW = 1;
    const bA = a * 0.2 * (Math.sin(t * 2) * 0.3 + 0.7);
    gl.strokeStyle = `rgba(196,30,42,${bA})`;
    gl.lineWidth = bW;
    [[10,10,1,1],[W-10,10,-1,1],[10,H-10,1,-1],[W-10,H-10,-1,-1]].forEach(([x,y,dx,dy]) => {
        gl.beginPath(); gl.moveTo(x, y+dy*bS); gl.lineTo(x, y); gl.lineTo(x+dx*bS, y); gl.stroke();
    });
    // Heartbeat flash
    const hb = Math.pow(Math.max(0, Math.sin(t * 1.8)), 12);
    if (hb > 0.01) {
        const hg = gl.createRadialGradient(W/2, H/2, 0, W/2, H/2, W * 0.8);
        hg.addColorStop(0, `rgba(196,30,42,${hb * a * 0.04})`);
        hg.addColorStop(1, 'rgba(0,0,0,0)');
        gl.fillStyle = hg;
        gl.fillRect(0, 0, W, H);
    }
    // Energy motes
    for (let i = 0; i < 15; i++) {
        const mx = (Math.sin(t * 0.7 + i * 2.1) * 0.45 + 0.5) * W;
        const my = (Math.cos(t * 0.5 + i * 1.7) * 0.45 + 0.5) * H;
        const ma = Math.sin(t * 3 + i * 1.3) * 0.4 + 0.6;
        gl.beginPath(); gl.arc(mx, my, 0.8, 0, Math.PI * 2);
        gl.fillStyle = `rgba(196,30,42,${a * ma * 0.25})`;
        gl.fill();
    }
}

// ─── TEXT SLAM — instant impact text with aftershock ───
function drawTextSlam(text, x, y, size, alpha, age, isRed) {
    if (alpha < 0.01) return;
    const scale = age < 0.15 ? lerp(1.8, 1, easeOut(age / 0.15)) : 1;
    const shake = age < 0.2 ? (1 - age / 0.2) * 4 : 0;
    const sx = x + (Math.random() - 0.5) * shake;
    const sy = y + (Math.random() - 0.5) * shake;

    gl.save();
    gl.translate(sx, sy);
    gl.scale(scale, scale);
    gl.font = `800 ${size}px Orbitron, sans-serif`;
    gl.textAlign = 'center';
    gl.textBaseline = 'middle';

    // Glow behind
    if (age < 0.5) {
        const glowA = (1 - age / 0.5) * alpha * 0.15;
        const gg = gl.createRadialGradient(0, 0, 0, 0, 0, size * 3);
        gg.addColorStop(0, `rgba(196,30,42,${glowA})`);
        gg.addColorStop(1, 'rgba(196,30,42,0)');
        gl.fillStyle = gg;
        gl.fillRect(-size*3, -size*3, size*6, size*6);
    }

    gl.fillStyle = isRed
        ? `rgba(196,30,42,${alpha})`
        : `rgba(245,245,247,${alpha * 0.95})`;
    gl.fillText(text, 0, 0);
    gl.restore();
}

// ─── FEATURE CALLOUT — aggressive reveal ───
function drawFeatureCallout(text, sub, cx, cy, size, alpha, age) {
    if (alpha < 0.01) return;
    // Horizontal line sweep
    const lineW = W * 0.7 * clamp(age / 0.2);
    gl.fillStyle = `rgba(196,30,42,${alpha * 0.4})`;
    gl.fillRect(cx - lineW/2, cy - size * 0.7, lineW, 1);

    // Main text
    const reveal = clamp(age / 0.15);
    gl.font = `700 ${size}px Orbitron, sans-serif`;
    gl.textAlign = 'center';
    gl.textBaseline = 'middle';
    gl.save();
    gl.beginPath();
    gl.rect(cx - W/2, cy - size, W * reveal, size * 2);
    gl.clip();
    gl.fillStyle = `rgba(245,245,247,${alpha * 0.9})`;
    gl.fillText(text, cx, cy);
    gl.restore();

    // Sub text
    if (age > 0.15) {
        const subA = clamp((age - 0.15) / 0.15) * alpha;
        gl.font = `400 ${Math.floor(size * 0.45)}px Orbitron, sans-serif`;
        gl.fillStyle = `rgba(196,30,42,${subA * 0.6})`;
        gl.textAlign = 'center';
        gl.fillText(sub, cx, cy + size * 0.9);
    }
}

// ─── CONTINENT DATA (simplified for small globe) ───
const continentPts = [
    // North America
    [50,-120],[48,-123],[44,-124],[40,-122],[36,-120],[32,-117],[28,-110],[24,-105],
    [30,-96],[34,-78],[38,-75],[42,-72],[46,-67],[48,-56],[52,-56],[55,-60],
    [60,-140],[65,-140],[68,-150],[70,-160],[65,-168],[55,-162],
    [45,-100],[42,-98],[40,-95],[38,-92],[45,-90],[48,-85],[50,-100],[52,-110],
    [55,-120],[58,-130],[46,-105],[42,-105],[38,-100],[36,-96],[34,-92],
    // South America
    [12,-72],[7,-78],[2,-80],[-5,-80],[-10,-78],[-18,-72],[-24,-65],[-30,-62],
    [-38,-57],[-46,-68],[-54,-68],[-52,-70],[-40,-65],[-34,-53],[-26,-48],
    [-18,-40],[-8,-35],[-2,-44],[4,-54],[10,-64],
    [-10,-55],[-15,-60],[-20,-55],[-25,-55],[-30,-55],[-15,-48],[-20,-50],
    // Europe
    [60,12],[56,8],[52,5],[48,-5],[44,0],[40,-4],[36,-6],[38,2],[42,3],[46,8],
    [50,6],[54,12],[58,14],[62,24],[66,14],[64,12],[68,16],[70,26],[58,22],
    [50,15],[46,12],[42,8],[44,18],[48,18],[52,18],
    // Africa
    [36,10],[30,10],[24,8],[18,2],[12,-4],[6,-2],[0,10],[-4,14],[-12,22],
    [-20,32],[-26,32],[-34,26],[-32,18],[-26,18],[-18,14],[-10,8],[-4,10],
    [36,36],[30,35],[24,38],[18,44],[12,48],[6,42],[0,38],[-6,30],[-12,20],
    [10,20],[20,20],[0,25],[-10,25],[15,30],[25,25],[-20,28],[-28,22],
    // Asia
    [70,60],[70,100],[70,140],[62,60],[56,45],[50,42],[44,50],[38,56],
    [30,48],[24,55],[16,65],[8,80],[0,75],[-6,80],
    [50,70],[50,90],[50,110],[45,65],[45,85],[45,105],[40,70],[40,90],
    [35,70],[35,90],[35,110],[55,60],[55,80],[55,100],[60,80],[60,110],
    [65,80],[65,120],[28,75],[22,82],[14,78],[42,132],[36,130],[44,140],
    // Australia
    [-14,128],[-20,118],[-26,114],[-32,118],[-36,138],[-30,148],[-24,152],
    [-18,146],[-12,140],[-16,132],[-20,124],
    [-22,130],[-26,130],[-30,130],[-22,135],[-26,135],[-30,135],[-24,140],
];

// ─── AUDIO ENGINE ───
let ac = null;
function initAudio() { ac = new (window.AudioContext || window.webkitAudioContext)(); }

function boom(t, f, d, v) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = f;
    const now = ac.currentTime + t;
    g.gain.setValueAtTime(v, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + d);
    o.connect(g); g.connect(ac.destination);
    o.start(now); o.stop(now + d);
}

function noise(t, d, v) {
    if (!ac) return;
    const buf = ac.createBuffer(1, ac.sampleRate * d, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
    const src = ac.createBufferSource();
    src.buffer = buf;
    const g = ac.createGain(), fl = ac.createBiquadFilter();
    fl.type = 'bandpass'; fl.frequency.value = 800; fl.Q.value = 2;
    const now = ac.currentTime + t;
    g.gain.setValueAtTime(v, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + d);
    src.connect(fl); fl.connect(g); g.connect(ac.destination);
    src.start(now); src.stop(now + d);
}

function pad(t, d, f, v) {
    if (!ac) return;
    const o1 = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain();
    o1.type = 'sawtooth'; o1.frequency.value = f;
    o2.type = 'sawtooth'; o2.frequency.value = f * 1.005;
    const fl = ac.createBiquadFilter();
    fl.type = 'lowpass'; fl.frequency.value = 400;
    const now = ac.currentTime + t;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(v, now + d * 0.3);
    g.gain.linearRampToValueAtTime(0, now + d);
    o1.connect(fl); o2.connect(fl); fl.connect(g); g.connect(ac.destination);
    o1.start(now); o2.start(now); o1.stop(now + d); o2.stop(now + d);
}

function scheduleAudio() {
    // Scene 0: Dark ignition
    boom(0.5, 30, 2, 0.15);
    pad(0, 3, 40, 0.06);
    noise(2.2, 0.3, 0.08);

    // Scene 1: Text slam impacts
    boom(3.0, 35, 0.8, 0.2);
    boom(3.6, 40, 0.6, 0.15);
    noise(3.0, 0.15, 0.12);
    noise(3.6, 0.15, 0.1);
    pad(3, 2.5, 45, 0.07);

    // Scene 2: Feature callouts — 3 hits
    boom(5.5, 50, 0.5, 0.12);
    boom(6.5, 55, 0.5, 0.12);
    boom(7.5, 60, 0.5, 0.12);
    noise(5.5, 0.1, 0.06);
    noise(6.5, 0.1, 0.06);
    noise(7.5, 0.1, 0.06);

    // Scene 3: Globe tension
    pad(8.5, 3, 35, 0.08);
    boom(8.5, 28, 1.5, 0.1);

    // Scene 4: Data rain
    pad(11.5, 3, 50, 0.06);
    noise(11.5, 0.3, 0.05);

    // Scene 5: Logo slam — BIG impact
    boom(14.5, 25, 2, 0.25);
    boom(14.5, 50, 1.5, 0.15);
    noise(14.5, 0.4, 0.15);
    pad(14.5, 4, 40, 0.1);

    // Scene 6: Fade tension
    pad(18.5, 3.5, 30, 0.04);
}

// ─── MAIN STATE ───
let startTime = 0;
let frame = 0;
let running = false;

document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('overlay').style.opacity = '0';
    setTimeout(() => document.getElementById('overlay').style.display = 'none', 500);
    initAudio();
    scheduleAudio();
    startTime = performance.now() / 1000;
    running = true;
    requestAnimationFrame(render);
});

// ─── RENDER LOOP ───
function render() {
    if (!running) return;
    const now = performance.now() / 1000;
    const t = now - startTime;
    frame++;

    if (t > TOTAL_DUR + 1) { running = false; return; }

    // Update glitch
    if (glitchTimer > 0) {
        glitchTimer -= 1/60;
        if (glitchTimer <= 0) glitchIntensity = 0;
    }

    // Determine scene
    let scene = 0;
    for (let i = SCENES.length - 1; i >= 0; i--) {
        if (t >= SCENES[i].s) { scene = i; break; }
    }

    // Clear
    gl.fillStyle = '#050505';
    gl.fillRect(0, 0, W, H);

    // ═══════════════════════════════════════════
    // SCENE 0: DARK SPARK IGNITION
    // ═══════════════════════════════════════════
    if (scene === 0) {
        const lt = t - SCENES[0].s;
        const a = fadeIO(sp(t, 0), 0, 0.05, 0.85, 0.15);

        // Total darkness → single red spark in center at 0.5s
        const sparkBirth = fade(lt, 0.5, 0.3);
        if (sparkBirth > 0) {
            const sparkR = 3 + sparkBirth * 8;
            const sparkPulse = Math.sin(lt * 12) * 0.3 + 0.7;
            const sg = gl.createRadialGradient(W/2, H/2, 0, W/2, H/2, sparkR * 8);
            sg.addColorStop(0, `rgba(196,30,42,${a * sparkBirth * 0.5 * sparkPulse})`);
            sg.addColorStop(0.3, `rgba(196,30,42,${a * sparkBirth * 0.15})`);
            sg.addColorStop(1, 'rgba(0,0,0,0)');
            gl.fillStyle = sg;
            gl.fillRect(0, 0, W, H);

            gl.beginPath();
            gl.arc(W/2, H/2, sparkR * sparkPulse, 0, Math.PI * 2);
            gl.fillStyle = `rgba(245,245,247,${a * sparkBirth * 0.9})`;
            gl.fill();
        }

        // Particles rush INWARD toward center (1-3s)
        const pullPhase = fade(lt, 1, 1.5);
        for (let i = 0; i < PC; i++) {
            const targetX = 0, targetY = 0;
            const pull = pullPhase * 0.04;
            px[i] = lerp(px[i], targetX, pull);
            py[i] = lerp(py[i], targetY, pull);
            px[i] += pvx[i]; py[i] += pvy[i];

            const sx = (px[i] * 0.5 + 0.5) * W;
            const sy = (py[i] * 0.5 + 0.5) * H;
            const dist = Math.hypot(sx - W/2, sy - H/2);
            const distN = dist / (H * 0.5);
            const trail = clamp(1 - distN * 0.8);

            gl.beginPath(); gl.arc(sx, sy, psz[i] * 0.6 * (0.5 + trail * 0.5), 0, Math.PI * 2);
            gl.fillStyle = i % 5 === 0
                ? `rgba(196,30,42,${a * trail * 0.35})`
                : `rgba(245,245,247,${a * trail * 0.08})`;
            gl.fill();

            // Speed trails toward center
            if (pullPhase > 0.3 && trail > 0.2) {
                const ang = Math.atan2(sy - H/2, sx - W/2);
                gl.beginPath();
                gl.moveTo(sx, sy);
                gl.lineTo(sx + Math.cos(ang) * dist * 0.06, sy + Math.sin(ang) * dist * 0.06);
                gl.strokeStyle = `rgba(196,30,42,${a * trail * 0.1})`;
                gl.lineWidth = 0.5;
                gl.stroke();
            }
        }

        // Electric arcs crackle (1.5-3s)
        const arcPhase = fade(lt, 1.5, 0.5);
        if (arcPhase > 0) {
            for (let i = 0; i < 6; i++) {
                const ang = (lt * 2 + i * Math.PI / 3);
                const len = 30 + arcPhase * H * 0.15;
                let ax = W/2, ay = H/2;
                gl.beginPath();
                gl.moveTo(ax, ay);
                for (let seg = 0; seg < 8; seg++) {
                    ax += Math.cos(ang + (Math.random()-0.5)*1.5) * (len/8);
                    ay += Math.sin(ang + (Math.random()-0.5)*1.5) * (len/8);
                    gl.lineTo(ax, ay);
                }
                gl.strokeStyle = `rgba(196,30,42,${a * arcPhase * 0.3 * (Math.random()*0.5+0.5)})`;
                gl.lineWidth = 1;
                gl.stroke();
            }
        }

        // Shockwave at 2.5s
        const shockAge = lt - 2.5;
        if (shockAge > 0 && shockAge < 0.8) {
            const sr = easeOut(shockAge / 0.8) * H * 0.5;
            const sa = (1 - shockAge / 0.8) * a;
            gl.beginPath(); gl.arc(W/2, H/2, sr, 0, Math.PI * 2);
            gl.strokeStyle = `rgba(196,30,42,${sa * 0.5})`;
            gl.lineWidth = 2;
            gl.stroke();
            // Screen flash
            if (shockAge < 0.1) {
                gl.fillStyle = `rgba(196,30,42,${(1 - shockAge/0.1) * 0.15})`;
                gl.fillRect(0, 0, W, H);
            }
            triggerGlitch(0.8, 0.2);
        }

        drawAliveLayer(t, a * 0.5);
    }

    // ═══════════════════════════════════════════
    // SCENE 1: "THE FUTURE DOESN'T WAIT" — text slam
    // ═══════════════════════════════════════════
    else if (scene === 1) {
        const lt = t - SCENES[1].s;
        const a = fadeIO(sp(t, 1), 0, 0.03, 0.8, 0.2);

        // Background tension
        const bg = gl.createRadialGradient(W/2, H*0.35, 0, W/2, H*0.35, H*0.5);
        bg.addColorStop(0, `rgba(196,30,42,${a * 0.06})`);
        bg.addColorStop(1, 'rgba(0,0,0,0)');
        gl.fillStyle = bg;
        gl.fillRect(0, 0, W, H);

        // Ambient particles
        for (let i = 0; i < 200; i++) {
            px[i] += pvx[i] * 0.5; py[i] += pvy[i] * 0.5;
            const sx = (px[i]*0.5+0.5)*W, sy = (py[i]*0.5+0.5)*H;
            gl.beginPath(); gl.arc(sx, sy, 0.5, 0, Math.PI*2);
            gl.fillStyle = `rgba(196,30,42,${a * 0.06})`;
            gl.fill();
        }

        // "THE FUTURE" slams in at lt=0
        const line1Size = Math.floor(W * 0.11);
        const line1Age = lt;
        const line1A = a * clamp(line1Age / 0.1);
        if (line1Age >= 0) {
            drawTextSlam('THE', W/2, H * 0.32, line1Size * 0.8, line1A, line1Age, false);
            drawTextSlam('FUTURE', W/2, H * 0.32 + line1Size * 1.1, line1Size, line1A, line1Age, false);
        }
        // Glitch on impact
        if (lt > 0 && lt < 0.05) triggerGlitch(1, 0.15);

        // "DOESN'T WAIT" slams in at lt=0.6
        const line2Age = lt - 0.6;
        const line2A = a * clamp(line2Age / 0.1);
        if (line2Age >= 0) {
            drawTextSlam("DOESN'T", W/2, H * 0.55, line1Size * 0.8, line2A, line2Age, true);
            drawTextSlam('WAIT.', W/2, H * 0.55 + line1Size * 1.1, line1Size * 1.2, line2A, line2Age, true);
        }
        if (lt > 0.6 && lt < 0.65) triggerGlitch(0.7, 0.12);

        // Horizontal line accent
        const lineReveal = clamp((lt - 0.3) / 0.3);
        const lineW2 = W * 0.6 * lineReveal;
        gl.fillStyle = `rgba(196,30,42,${a * 0.3})`;
        gl.fillRect(W/2 - lineW2/2, H * 0.47, lineW2, 1);

        drawAliveLayer(t, a * 0.8);
    }

    // ═══════════════════════════════════════════
    // SCENE 2: FEATURE RAPID-FIRE — 3 callouts slam in
    // ═══════════════════════════════════════════
    else if (scene === 2) {
        const lt = t - SCENES[2].s;
        const a = fadeIO(sp(t, 2), 0, 0.03, 0.85, 0.15);

        // Animated vertical data lines in background
        for (let i = 0; i < 20; i++) {
            const lx = (i / 20) * W + Math.sin(lt * 2 + i) * 5;
            const speed = 1.5 + (i % 3) * 0.8;
            const top = ((lt * speed * 80 + i * 47) % (H + 100)) - 50;
            gl.fillStyle = `rgba(196,30,42,${a * 0.03})`;
            gl.fillRect(lx, top, 0.5, 40 + Math.sin(i) * 20);
        }

        // Feature 1: 24/7 AI RECEPTION (lt=0)
        const f1Age = lt;
        const f1A = a * clamp(f1Age / 0.1) * fadeO(lt, 0.8, 0.15);
        if (f1Age >= 0 && lt < 1.0) {
            drawFeatureCallout('24/7 AI', 'NEVER SLEEPS. NEVER MISSES.', W/2, H * 0.35, Math.floor(W * 0.1), f1A, f1Age);
            if (lt < 0.05) triggerGlitch(0.5, 0.1);
        }

        // Feature 2: VOICE AI (lt=1)
        const f2Age = lt - 1;
        const f2A = a * clamp(f2Age / 0.1) * fadeO(lt, 1.8, 0.15);
        if (f2Age >= 0 && lt < 2.0) {
            drawFeatureCallout('VOICE AI', 'INBOUND. OUTBOUND. ALWAYS.', W/2, H * 0.5, Math.floor(W * 0.1), f2A, f2Age);
            if (lt > 1 && lt < 1.05) triggerGlitch(0.5, 0.1);
        }

        // Feature 3: LEAD GEN (lt=2)
        const f3Age = lt - 2;
        const f3A = a * clamp(f3Age / 0.1);
        if (f3Age >= 0) {
            drawFeatureCallout('LEAD GEN', 'AUTONOMOUS. OPTIMIZED.', W/2, H * 0.65, Math.floor(W * 0.1), f3A, f3Age);
            if (lt > 2 && lt < 2.05) triggerGlitch(0.5, 0.1);
        }

        // Status bar at bottom
        const filled = clamp(lt / 2.5);
        gl.fillStyle = `rgba(30,30,32,${a * 0.5})`;
        gl.fillRect(W * 0.1, H * 0.88, W * 0.8, 3);
        gl.fillStyle = `rgba(196,30,42,${a * 0.6})`;
        gl.fillRect(W * 0.1, H * 0.88, W * 0.8 * filled, 3);

        // "SYSTEM ACTIVE" label
        gl.font = `400 ${Math.floor(W*0.025)}px Orbitron, sans-serif`;
        gl.textAlign = 'center';
        gl.fillStyle = `rgba(196,30,42,${a * 0.3 * (Math.sin(lt*4)*0.3+0.7)})`;
        gl.fillText('SYSTEMS ACTIVE', W/2, H * 0.92);

        drawAliveLayer(t, a * 0.7);
    }

    // ═══════════════════════════════════════════
    // SCENE 3: GLOBE — worldwide connections
    // ═══════════════════════════════════════════
    else if (scene === 3) {
        const lt = t - SCENES[3].s;
        const a = fadeIO(sp(t, 3), 0, 0.05, 0.85, 0.15);

        const globeR = Math.min(W, H) * 0.25;
        const gCx = W * 0.5, gCy = H * 0.42;
        const globeA = fade(lt, 0, 0.5) * a;
        const rot = lt * 0.4; // faster spin for hype

        // Globe glow
        const gg = gl.createRadialGradient(gCx, gCy, 0, gCx, gCy, globeR * 1.5);
        gg.addColorStop(0, `rgba(196,30,42,${globeA * 0.08})`);
        gg.addColorStop(0.6, `rgba(139,26,26,${globeA * 0.02})`);
        gg.addColorStop(1, 'rgba(0,0,0,0)');
        gl.fillStyle = gg;
        gl.fillRect(0, 0, W, H);

        // Outer ring
        gl.beginPath(); gl.arc(gCx, gCy, globeR, 0, Math.PI * 2);
        gl.strokeStyle = `rgba(196,30,42,${globeA * 0.15})`;
        gl.lineWidth = 0.5;
        gl.stroke();

        // Continent points
        const degR = Math.PI / 180;
        for (let i = 0; i < continentPts.length; i++) {
            const [latD, lonD] = continentPts[i];
            const laR = latD * degR, loR = lonD * degR + rot;
            const cL = Math.cos(laR);
            const x3 = cL * Math.sin(loR), y3 = -Math.sin(laR), z3 = cL * Math.cos(loR);
            if (z3 < -0.05) continue;
            const sx = gCx + x3 * globeR, sy = gCy + y3 * globeR;
            const da = 0.2 + z3 * 0.8;
            const ds = 0.8 + z3 * 0.8;
            const shimmer = Math.sin(lt * 3 + i * 0.1) * 0.1 + 0.9;
            gl.beginPath(); gl.arc(sx, sy, ds, 0, Math.PI * 2);
            gl.fillStyle = `rgba(196,30,42,${globeA * da * shimmer * 0.8})`;
            gl.fill();
        }

        // Connection pulses — random arcs across globe
        const connCount = Math.min(8, Math.floor(lt * 3));
        for (let i = 0; i < connCount; i++) {
            const ang1 = rot + i * 0.8, ang2 = rot + i * 0.8 + 1.2;
            const lat1 = Math.sin(i * 1.7) * 0.6, lat2 = Math.sin(i * 2.3 + 1) * 0.6;
            const x1 = gCx + Math.cos(ang1) * Math.cos(lat1) * globeR;
            const y1 = gCy - Math.sin(lat1) * globeR;
            const x2 = gCx + Math.cos(ang2) * Math.cos(lat2) * globeR;
            const y2 = gCy - Math.sin(lat2) * globeR;
            if (Math.cos(ang1) < -0.1 && Math.cos(ang2) < -0.1) continue;
            const mx = (x1+x2)/2, my = (y1+y2)/2 - 20;
            gl.beginPath(); gl.moveTo(x1, y1);
            gl.quadraticCurveTo(mx, my, x2, y2);
            gl.strokeStyle = `rgba(196,30,42,${globeA * 0.08})`;
            gl.lineWidth = 0.5;
            gl.stroke();
            // Pulse dot
            const pp = (lt * 0.5 + i * 0.15) % 1;
            const ppx = lerp(lerp(x1,mx,pp), lerp(mx,x2,pp), pp);
            const ppy = lerp(lerp(y1,my,pp), lerp(my,y2,pp), pp);
            gl.beginPath(); gl.arc(ppx, ppy, 2, 0, Math.PI * 2);
            gl.fillStyle = `rgba(196,30,42,${globeA * 0.4})`;
            gl.fill();
        }

        // "GLOBAL REACH" text
        const textA = fade(lt, 1, 0.5) * a;
        gl.font = `700 ${Math.floor(W*0.07)}px Orbitron, sans-serif`;
        gl.textAlign = 'center';
        gl.textBaseline = 'middle';
        gl.fillStyle = `rgba(245,245,247,${textA * 0.8})`;
        gl.fillText('GLOBAL', W/2, H * 0.73);
        gl.fillStyle = `rgba(196,30,42,${textA * 0.9})`;
        gl.fillText('REACH', W/2, H * 0.73 + Math.floor(W*0.08));

        // Counter
        const leads = Math.floor(lt * 5000);
        gl.font = `400 ${Math.floor(W*0.03)}px Orbitron, sans-serif`;
        gl.fillStyle = `rgba(196,30,42,${textA * 0.4})`;
        gl.fillText(leads.toLocaleString() + ' LEADS CAPTURED', W/2, H * 0.92);

        drawAliveLayer(t, a * 0.7);
    }

    // ═══════════════════════════════════════════
    // SCENE 4: DATA MATRIX RAIN
    // ═══════════════════════════════════════════
    else if (scene === 4) {
        const lt = t - SCENES[4].s;
        const a = fadeIO(sp(t, 4), 0, 0.05, 0.8, 0.2);

        // Matrix rain columns
        const colCount = 30;
        const colW = W / colCount;
        const chars = '01ADRECTIVE.AI01001011010110100111';

        for (let c = 0; c < colCount; c++) {
            const cx = c * colW + colW / 2;
            const speed = 2 + (c % 5) * 0.6;
            const colA = a * (0.4 + Math.sin(c * 0.5 + lt) * 0.3);
            const charSize = Math.floor(W * 0.028);
            gl.font = `500 ${charSize}px Orbitron, sans-serif`;
            gl.textAlign = 'center';

            for (let row = 0; row < 25; row++) {
                const baseY = ((lt * speed * 40 + row * charSize * 1.4 + c * 17) % (H + 100)) - 50;
                const charIdx = (c * 7 + row + Math.floor(lt * 3)) % chars.length;
                const ch = chars[charIdx];
                const isHead = row === 0;
                const fadeDown = 1 - row / 25;

                gl.fillStyle = isHead
                    ? `rgba(245,245,247,${colA * 0.7 * fadeDown})`
                    : `rgba(196,30,42,${colA * 0.25 * fadeDown})`;
                gl.fillText(ch, cx, baseY);
            }
        }

        // Center text overlay
        const textA2 = fade(lt, 0.5, 0.5) * a;
        const txtSize = Math.floor(W * 0.065);
        gl.font = `800 ${txtSize}px Orbitron, sans-serif`;
        gl.textAlign = 'center';
        gl.textBaseline = 'middle';

        // Dark box behind text
        const boxW = W * 0.85, boxH = txtSize * 3.5;
        gl.fillStyle = `rgba(5,5,5,${textA2 * 0.85})`;
        gl.fillRect(W/2 - boxW/2, H/2 - boxH/2, boxW, boxH);
        gl.strokeStyle = `rgba(196,30,42,${textA2 * 0.3})`;
        gl.lineWidth = 0.5;
        gl.strokeRect(W/2 - boxW/2, H/2 - boxH/2, boxW, boxH);

        gl.fillStyle = `rgba(245,245,247,${textA2 * 0.85})`;
        gl.fillText('BUILT FROM', W/2, H/2 - txtSize * 0.6);
        gl.fillStyle = `rgba(196,30,42,${textA2 * 0.95})`;
        gl.fillText('THE GROUND', W/2, H/2 + txtSize * 0.6);

        // Accent
        gl.font = `400 ${Math.floor(txtSize*0.35)}px Orbitron, sans-serif`;
        gl.fillStyle = `rgba(196,30,42,${textA2 * 0.4})`;
        gl.fillText('PROPRIETARY INFRASTRUCTURE', W/2, H/2 + txtSize * 1.5);

        drawAliveLayer(t, a * 0.6);
    }

    // ═══════════════════════════════════════════
    // SCENE 5: LOGO SLAM — ADRECTIVE.AI
    // ═══════════════════════════════════════════
    else if (scene === 5) {
        const lt = t - SCENES[5].s;
        const a = fadeIO(sp(t, 5), 0, 0.02, 0.85, 0.15);

        // Screen flash on entry
        if (lt < 0.15) {
            gl.fillStyle = `rgba(196,30,42,${(1 - lt/0.15) * 0.2})`;
            gl.fillRect(0, 0, W, H);
            triggerGlitch(1.2, 0.2);
        }

        // Background energy
        const bg2 = gl.createRadialGradient(W/2, H/2, 0, W/2, H/2, H*0.5);
        bg2.addColorStop(0, `rgba(196,30,42,${a * 0.08})`);
        bg2.addColorStop(0.5, `rgba(139,26,26,${a * 0.02})`);
        bg2.addColorStop(1, 'rgba(0,0,0,0)');
        gl.fillStyle = bg2;
        gl.fillRect(0, 0, W, H);

        // Particles swirling around center
        for (let i = 0; i < 400; i++) {
            const ang = lt * 0.5 + i * 0.031;
            const dist = 80 + Math.sin(i * 0.7 + lt) * 60 + i * 0.3;
            const sx = W/2 + Math.cos(ang) * dist;
            const sy = H/2 + Math.sin(ang) * dist * 0.6;
            const pa = a * 0.1 * (1 - Math.min(dist, 300)/300);
            gl.beginPath(); gl.arc(sx, sy, 0.8, 0, Math.PI * 2);
            gl.fillStyle = `rgba(196,30,42,${pa})`;
            gl.fill();
        }

        // Logo text
        const logoSize = Math.floor(W * 0.1);
        const logoAge = lt;
        const logoA = a * clamp(logoAge / 0.1);

        gl.font = `800 ${logoSize}px Orbitron, sans-serif`;
        gl.textAlign = 'center';
        gl.textBaseline = 'middle';

        // Measure for split coloring
        const adrW = gl.measureText('ADRECTIVE').width;
        const dotAiW = gl.measureText('.AI').width;
        const fullW = adrW + dotAiW;
        const startX = W/2 - fullW/2;

        // Scale slam
        const scale = logoAge < 0.15 ? lerp(2, 1, easeOut(logoAge / 0.15)) : 1;
        const shake = logoAge < 0.25 ? (1 - logoAge/0.25) * 6 : 0;
        const shakeX = (Math.random()-0.5) * shake;
        const shakeY = (Math.random()-0.5) * shake;

        gl.save();
        gl.translate(W/2 + shakeX, H * 0.45 + shakeY);
        gl.scale(scale, scale);

        // Glow behind logo
        const breathe = Math.sin(lt * 2.5) * 0.3 + 0.7;
        const lg = gl.createRadialGradient(0, 0, 0, 0, 0, fullW * 0.8);
        lg.addColorStop(0, `rgba(196,30,42,${logoA * 0.1 * breathe})`);
        lg.addColorStop(1, 'rgba(0,0,0,0)');
        gl.fillStyle = lg;
        gl.fillRect(-fullW, -logoSize*2, fullW*2, logoSize*4);

        // "ADRECTIVE" in white
        gl.font = `800 ${logoSize}px Orbitron, sans-serif`;
        gl.textAlign = 'left';
        gl.textBaseline = 'middle';
        gl.fillStyle = `rgba(245,245,247,${logoA * 0.95})`;
        gl.fillText('ADRECTIVE', -fullW/2, 0);

        // ".AI" in red
        gl.fillStyle = `rgba(196,30,42,${logoA})`;
        gl.fillText('.AI', -fullW/2 + adrW, 0);

        gl.restore();

        // Scan line
        const scanY = H * 0.45 - logoSize * 0.5 + ((frame * 0.6) % (logoSize * 1.2));
        gl.fillStyle = `rgba(196,30,42,${logoA * 0.03 * breathe})`;
        gl.fillRect(startX - 10, scanY + (Math.random()-0.5)*shake, fullW + 20, 1);

        // Underline
        const lineReveal2 = clamp((lt - 0.3) / 0.4);
        const ulW = fullW * 0.5 * lineReveal2;
        const ulGrad = gl.createLinearGradient(W/2 - ulW/2, 0, W/2 + ulW/2, 0);
        ulGrad.addColorStop(0, 'rgba(196,30,42,0)');
        ulGrad.addColorStop(0.3, `rgba(196,30,42,${logoA * 0.4})`);
        ulGrad.addColorStop(0.7, `rgba(196,30,42,${logoA * 0.4})`);
        ulGrad.addColorStop(1, 'rgba(196,30,42,0)');
        gl.fillStyle = ulGrad;
        gl.fillRect(W/2 - ulW/2, H * 0.45 + logoSize * 0.6, ulW, 1.5);

        // EM pulse rings
        if (lt > 0.2 && lt < 1.5) {
            const pulseAge = lt - 0.2;
            for (let r = 0; r < 3; r++) {
                const rr = pulseAge * W * 0.3 * (1 - r * 0.2);
                if (rr <= 0) continue;
                const rA = (1 - pulseAge / 1.3) * logoA * 0.2;
                gl.beginPath(); gl.arc(W/2, H*0.45, rr, 0, Math.PI*2);
                gl.strokeStyle = `rgba(196,30,42,${rA * (1 - r*0.3)})`;
                gl.lineWidth = 1.5 - r * 0.4;
                gl.stroke();
            }
        }

        // Tagline
        const tagA = fade(lt, 1.5, 0.8) * a;
        if (tagA > 0) {
            const tagSize = Math.floor(logoSize * 0.3);
            gl.font = `500 ${tagSize}px Orbitron, sans-serif`;
            gl.textAlign = 'center';
            gl.textBaseline = 'middle';
            gl.fillStyle = `rgba(245,245,247,${tagA * 0.5})`;
            gl.fillText('AUTONOMOUS GROWTH', W/2, H * 0.55 + logoSize * 0.3);
            gl.fillStyle = `rgba(196,30,42,${tagA * 0.6})`;
            gl.fillText('ENGINEERED', W/2, H * 0.55 + logoSize * 0.3 + tagSize * 1.4);
        }

        // Website / CTA
        const ctaA = fade(lt, 2.5, 0.8) * a;
        if (ctaA > 0) {
            const ctaSize = Math.floor(W * 0.03);
            gl.font = `400 ${ctaSize}px Orbitron, sans-serif`;
            gl.textAlign = 'center';
            gl.fillStyle = `rgba(196,30,42,${ctaA * 0.5 * (Math.sin(lt*3)*0.2+0.8)})`;
            gl.fillText('ADRECTIVE.AI', W/2, H * 0.82);

            // CTA box
            const ctaW2 = gl.measureText('ADRECTIVE.AI').width + 30;
            gl.strokeStyle = `rgba(196,30,42,${ctaA * 0.25})`;
            gl.lineWidth = 0.5;
            gl.strokeRect(W/2 - ctaW2/2, H * 0.82 - ctaSize, ctaW2, ctaSize * 2.2);
        }

        drawAliveLayer(t, a * 0.9);
    }

    // ═══════════════════════════════════════════
    // SCENE 6: HOLD + FADE TO BLACK
    // ═══════════════════════════════════════════
    else if (scene === 6) {
        const lt = t - SCENES[6].s;
        const a = fadeO(lt, 0, 3);

        // Fading logo
        const logoSize = Math.floor(W * 0.1);
        gl.font = `800 ${logoSize}px Orbitron, sans-serif`;
        gl.textAlign = 'left';
        gl.textBaseline = 'middle';
        const adrW = gl.measureText('ADRECTIVE').width;
        const dotAiW = gl.measureText('.AI').width;
        const fullW = adrW + dotAiW;

        const breathe = Math.sin(lt * 2) * 0.3 + 0.7;
        const lg = gl.createRadialGradient(W/2, H*0.45, 0, W/2, H*0.45, fullW * 0.6);
        lg.addColorStop(0, `rgba(196,30,42,${a * 0.05 * breathe})`);
        lg.addColorStop(1, 'rgba(0,0,0,0)');
        gl.fillStyle = lg;
        gl.fillRect(0, 0, W, H);

        gl.fillStyle = `rgba(245,245,247,${a * 0.9})`;
        gl.fillText('ADRECTIVE', W/2 - fullW/2, H * 0.45);
        gl.fillStyle = `rgba(196,30,42,${a * 0.95})`;
        gl.fillText('.AI', W/2 - fullW/2 + adrW, H * 0.45);

        // Tagline
        const tagSize = Math.floor(logoSize * 0.3);
        gl.font = `500 ${tagSize}px Orbitron, sans-serif`;
        gl.textAlign = 'center';
        gl.fillStyle = `rgba(245,245,247,${a * 0.4})`;
        gl.fillText('AUTONOMOUS GROWTH', W/2, H * 0.55 + logoSize * 0.3);
        gl.fillStyle = `rgba(196,30,42,${a * 0.5})`;
        gl.fillText('ENGINEERED', W/2, H * 0.55 + logoSize * 0.3 + tagSize * 1.4);

        // Scan line fading
        const scanY = H * 0.45 - logoSize * 0.5 + ((frame * 0.4) % (logoSize * 1.2));
        gl.fillStyle = `rgba(196,30,42,${a * 0.02})`;
        gl.fillRect(W/2 - fullW/2 - 10, scanY, fullW + 20, 1);

        // Particles drifting away
        for (let i = 0; i < 100; i++) {
            px[i] += pvx[i] * 0.3; py[i] += pvy[i] * 0.3;
            const sx = (px[i]*0.5+0.5)*W, sy = (py[i]*0.5+0.5)*H;
            gl.beginPath(); gl.arc(sx, sy, 0.5, 0, Math.PI*2);
            gl.fillStyle = `rgba(196,30,42,${a * 0.04})`;
            gl.fill();
        }

        drawAliveLayer(t, a * 0.3);

        // Final black fade
        const blackFade = clamp((lt - 2) / 1.5);
        gl.fillStyle = `rgba(0,0,0,${blackFade})`;
        gl.fillRect(0, 0, W, H);
    }

    // ─── GLITCH OVERLAY (applied after scene render) ───
    drawGlitch(1);

    // ─── GLOBAL SCAN LINES (subtle CRT) ───
    for (let sy = 0; sy < H; sy += 4) {
        gl.fillStyle = 'rgba(0,0,0,0.03)';
        gl.fillRect(0, sy, W, 1);
    }

    // ─── VIGNETTE ───
    const vg = gl.createRadialGradient(W/2, H/2, W * 0.25, W/2, H/2, H * 0.7);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.5)');
    gl.fillStyle = vg;
    gl.fillRect(0, 0, W, H);

    // ─── SCENE TRANSITION GLITCH TRIGGERS ───
    for (let i = 1; i < SCENES.length; i++) {
        const transT = t - SCENES[i].s;
        if (transT > 0 && transT < 0.03) {
            triggerGlitch(0.6, 0.1);
        }
    }

    requestAnimationFrame(render);
}

</script>
</body>
</html>
