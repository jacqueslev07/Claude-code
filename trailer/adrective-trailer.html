<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adrective.Ai — Autonomous Growth</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: 'Inter', -apple-system, sans-serif; cursor: none; }
        canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }
        #hud {
            position: fixed; bottom: 32px; left: 40px; z-index: 10; pointer-events: none;
        }
        #hud-text {
            color: rgba(245,245,247,0.35); font-size: 11px; font-weight: 300;
            letter-spacing: 0.35em; text-transform: uppercase;
            opacity: 0; transition: opacity 1.5s ease;
        }
        #hud-text.active { opacity: 1; }
        #hud-sub {
            color: rgba(196,30,42,0.4); font-size: 9px; font-weight: 300;
            letter-spacing: 0.4em; text-transform: uppercase; margin-top: 6px;
            opacity: 0; transition: opacity 1.5s ease;
        }
        #hud-sub.active { opacity: 1; }
        #play-btn {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 100; background: transparent;
            border: 1px solid rgba(196,30,42,0.4); color: rgba(245,245,247,0.7);
            font-family: 'Inter', sans-serif; font-weight: 200; font-size: 13px;
            letter-spacing: 0.4em; text-transform: uppercase; padding: 16px 44px;
            cursor: pointer; transition: all 0.5s ease;
        }
        #play-btn:hover {
            background: rgba(196,30,42,0.1); border-color: rgba(196,30,42,0.8);
            box-shadow: 0 0 60px rgba(196,30,42,0.15);
        }
        #progress {
            position: fixed; bottom: 0; left: 0; height: 1px;
            background: rgba(196,30,42,0.6); z-index: 20; width: 0%;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div id="hud"><div id="hud-text"></div><div id="hud-sub"></div></div>
    <button id="play-btn">Initialize</button>
    <div id="progress"></div>

<script>
(() => {
    const c = document.getElementById('c');
    const gl = c.getContext('2d');
    const hud = document.getElementById('hud-text');
    const hudSub = document.getElementById('hud-sub');
    const playBtn = document.getElementById('play-btn');
    const progress = document.getElementById('progress');

    let W, H, playing = false, t0 = 0, scene = -1, frame = 0;
    const DUR = 72;

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        W = window.innerWidth; H = window.innerHeight;
        c.width = W * dpr; c.height = H * dpr;
        c.style.width = W + 'px'; c.style.height = H + 'px';
        gl.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize); resize();

    // ─── EASING ───
    const ease = t => t<.5?2*t*t:-1+(4-2*t)*t;
    const easeOut = t => 1-Math.pow(1-t,3);
    const easeIn = t => t*t*t;
    const clamp = (v,a=0,b=1) => Math.max(a,Math.min(b,v));
    const lerp = (a,b,t) => a+(b-a)*t;
    const fade = (t,s,d) => clamp(easeOut((t-s)/d));
    const fadeO = (t,s,d) => 1-clamp(easeIn((t-s)/d));
    const fadeIO = (t,i,id,o,od) => Math.min(fade(t,i,id), fadeO(t,o,od));

    // ─── SCENES ───
    const S = [
        {s:0,  e:10, n:'awakening'},
        {s:10, e:22, n:'reception'},
        {s:22, e:34, n:'outbound'},
        {s:34, e:46, n:'leadgen'},
        {s:46, e:54, n:'infrastructure'},
        {s:54, e:60, n:'control'},
        {s:60, e:68, n:'logo'},
        {s:68, e:72, n:'close'}
    ];
    const sp = (t,i) => clamp((t-S[i].s)/(S[i].e-S[i].s));

    // ─── PARTICLES — 2500 for dense field ───
    const PN = 2500;
    const px=new Float32Array(PN), py=new Float32Array(PN),
          pvx=new Float32Array(PN), pvy=new Float32Array(PN),
          pa=new Float32Array(PN), psz=new Float32Array(PN),
          pph=new Float32Array(PN);
    for(let i=0;i<PN;i++){
        px[i]=Math.random()*2-1; py[i]=Math.random()*2-1;
        pvx[i]=(Math.random()-.5)*.002; pvy[i]=(Math.random()-.5)*.002;
        pa[i]=.05+Math.random()*.15; psz[i]=.5+Math.random()*2;
        pph[i]=Math.random()*Math.PI*2;
    }

    // ─── NEURAL NETWORK NODES ───
    const NN = 60;
    const nx=new Float32Array(NN), ny=new Float32Array(NN),
          nvx=new Float32Array(NN), nvy=new Float32Array(NN);
    for(let i=0;i<NN;i++){
        nx[i]=Math.random()*2-1; ny[i]=Math.random()*2-1;
        nvx[i]=(Math.random()-.5)*.003; nvy[i]=(Math.random()-.5)*.003;
    }
    // precompute connections (nearby pairs)
    const nConns = [];
    for(let i=0;i<NN;i++) for(let j=i+1;j<NN;j++){
        const d=Math.hypot(nx[i]-nx[j],ny[i]-ny[j]);
        if(d<.6) nConns.push([i,j,d]);
    }

    // ─── HEXAGONAL GRID ───
    function drawHexGrid(alpha, pulse) {
        const sz = 40;
        const h = sz * Math.sqrt(3);
        const cols = Math.ceil(W / (sz * 1.5)) + 2;
        const rows = Math.ceil(H / h) + 2;
        for (let r = -1; r < rows; r++) {
            for (let c2 = -1; c2 < cols; c2++) {
                const cx = c2 * sz * 1.5;
                const cy = r * h + (c2 % 2 ? h/2 : 0);
                const dist = Math.hypot(cx - W/2, cy - H/2) / (W * 0.5);
                const pAlpha = Math.max(0, 1 - dist) * (0.7 + Math.sin(pulse + dist * 4) * 0.3);
                gl.strokeStyle = `rgba(196,30,42,${alpha * 0.06 * pAlpha})`;
                gl.lineWidth = 0.5;
                gl.beginPath();
                for (let s2 = 0; s2 < 6; s2++) {
                    const a2 = Math.PI / 3 * s2;
                    const hx = cx + sz * 0.6 * Math.cos(a2);
                    const hy = cy + sz * 0.6 * Math.sin(a2);
                    s2 === 0 ? gl.moveTo(hx, hy) : gl.lineTo(hx, hy);
                }
                gl.closePath(); gl.stroke();
            }
        }
    }

    // ─── PERSISTENT NEURAL NETWORK — grows throughout trailer like a brain building itself ───
    const BRAIN_N = 120;
    const bx=new Float32Array(BRAIN_N), by=new Float32Array(BRAIN_N),
          bvx=new Float32Array(BRAIN_N), bvy=new Float32Array(BRAIN_N),
          bBorn=new Float32Array(BRAIN_N);
    for(let i=0;i<BRAIN_N;i++){
        bx[i]=Math.random()*2-1; by[i]=Math.random()*2-1;
        bvx[i]=(Math.random()-.5)*.001; bvy[i]=(Math.random()-.5)*.001;
        bBorn[i] = i * 0.5 + Math.random() * 0.5;
    }

    function drawBrainNet(globalT, alpha) {
        if (alpha <= 0) return;
        const activeCount = Math.min(BRAIN_N, Math.floor(globalT * 1.8));
        for (let i = 0; i < activeCount; i++) {
            bx[i] += bvx[i]; by[i] += bvy[i];
            if(Math.abs(bx[i])>1.05) bvx[i]*=-1;
            if(Math.abs(by[i])>1.05) bvy[i]*=-1;
        }
        for (let i = 0; i < activeCount; i++) {
            const xi = (bx[i]*.5+.5)*W, yi = (by[i]*.5+.5)*H;
            for (let j = i+1; j < activeCount; j++) {
                const xj = (bx[j]*.5+.5)*W, yj = (by[j]*.5+.5)*H;
                const d = Math.hypot(xi-xj, yi-yj);
                const maxD = W * 0.15;
                if (d > maxD) continue;
                const strength = (1 - d/maxD);
                const pulse = Math.sin(globalT * 4 + i * 0.5 + j * 0.3) * 0.5 + 0.5;
                gl.beginPath(); gl.moveTo(xi, yi); gl.lineTo(xj, yj);
                gl.strokeStyle = `rgba(196,30,42,${alpha * strength * 0.12 * (0.5 + pulse * 0.5)})`;
                gl.lineWidth = strength * 1.2;
                gl.stroke();
                if (strength > 0.5 && pulse > 0.7) {
                    const sp2 = (globalT * 0.8 + i * 0.1) % 1;
                    const sx = lerp(xi, xj, sp2), sy = lerp(yi, yj, sp2);
                    gl.beginPath(); gl.arc(sx, sy, 1.5, 0, Math.PI*2);
                    gl.fillStyle = `rgba(196,30,42,${alpha * strength * 0.5})`;
                    gl.fill();
                }
            }
        }
        for (let i = 0; i < activeCount; i++) {
            const xi = (bx[i]*.5+.5)*W, yi = (by[i]*.5+.5)*H;
            const age = globalT - bBorn[i];
            const birthAlpha = clamp(age / 1.5);
            const pulse = Math.sin(globalT * 2.5 + i * 1.1) * 0.4 + 0.6;
            const r = 1.5 + pulse * 1.5;
            gl.beginPath(); gl.arc(xi, yi, r, 0, Math.PI*2);
            gl.fillStyle = `rgba(196,30,42,${alpha * birthAlpha * (0.25 + pulse * 0.35)})`;
            gl.fill();
            if (birthAlpha > 0.5) {
                const dg = gl.createRadialGradient(xi,yi,0,xi,yi,r*6);
                dg.addColorStop(0, `rgba(196,30,42,${alpha * birthAlpha * 0.06})`);
                dg.addColorStop(1, 'rgba(196,30,42,0)');
                gl.fillStyle = dg;
                gl.fillRect(xi-r*6, yi-r*6, r*12, r*12);
            }
        }
    }

    // ─── ALIVE LAYER — constant buzzing, pulsing energy across ALL scenes ───
    function drawAliveLayer(t, intensity) {
        if (intensity <= 0) return;

        // 1. Heartbeat pulse — screen-wide red flash in rhythm
        const heartbeat = Math.pow(Math.max(0, Math.sin(t * 1.8)), 12);
        const hbGlow = gl.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.7);
        hbGlow.addColorStop(0, `rgba(196,30,42,${heartbeat * intensity * 0.06})`);
        hbGlow.addColorStop(1, 'rgba(0,0,0,0)');
        gl.fillStyle = hbGlow;
        gl.fillRect(0, 0, W, H);

        // 2. Edge energy sparks — tiny electric arcs at screen borders
        for (let i = 0; i < 12; i++) {
            const seed = Math.sin(t * 17.3 + i * 91.7);
            if (seed < 0.3) continue;
            const edge = (i * 7 + Math.floor(t * 3)) % 4;
            let sx, sy, ex, ey;
            const len = 15 + seed * 35;
            const pos = ((t * 0.1 + i * 0.37) % 1);
            if (edge === 0) { sx = pos*W; sy = 0; ex = sx + (seed-0.5)*len*2; ey = len; }
            else if (edge === 1) { sx = pos*W; sy = H; ex = sx + (seed-0.5)*len*2; ey = H-len; }
            else if (edge === 2) { sx = 0; sy = pos*H; ex = len; ey = sy + (seed-0.5)*len*2; }
            else { sx = W; sy = pos*H; ex = W-len; ey = sy + (seed-0.5)*len*2; }
            gl.beginPath(); gl.moveTo(sx, sy); gl.lineTo(ex, ey);
            gl.strokeStyle = `rgba(196,30,42,${intensity * seed * 0.2})`;
            gl.lineWidth = 0.5;
            gl.stroke();
        }

        // 3. Pulsing corner brackets — targeting reticle
        const bracketSz = 25;
        const bA = intensity * (0.12 + Math.sin(t * 2.5) * 0.04);
        gl.strokeStyle = `rgba(196,30,42,${bA})`;
        gl.lineWidth = 1;
        gl.beginPath(); gl.moveTo(20, 20+bracketSz); gl.lineTo(20, 20); gl.lineTo(20+bracketSz, 20); gl.stroke();
        gl.beginPath(); gl.moveTo(W-20-bracketSz, 20); gl.lineTo(W-20, 20); gl.lineTo(W-20, 20+bracketSz); gl.stroke();
        gl.beginPath(); gl.moveTo(20, H-20-bracketSz); gl.lineTo(20, H-20); gl.lineTo(20+bracketSz, H-20); gl.stroke();
        gl.beginPath(); gl.moveTo(W-20-bracketSz, H-20); gl.lineTo(W-20, H-20); gl.lineTo(W-20, H-20-bracketSz); gl.stroke();

        // 4. Micro-glitch scan bars
        const glitchSeed = Math.sin(t * 47.1 + frame * 0.1);
        if (glitchSeed > 0.92) {
            const gy = (Math.sin(t * 137.3) * 0.5 + 0.5) * H;
            gl.fillStyle = `rgba(196,30,42,${intensity * 0.06})`;
            gl.fillRect(0, gy, W, 1 + Math.random() * 2);
        }

        // 5. Bottom system status pulse bar
        const statusPulse = Math.sin(t * 4) * 0.5 + 0.5;
        gl.fillStyle = `rgba(196,30,42,${intensity * 0.12 * statusPulse})`;
        gl.fillRect(0, H-1, W * (0.15 + statusPulse * 0.08), 1);

        // 6. Ambient energy motes — floating micro-particles
        for (let i = 0; i < 30; i++) {
            const mx = ((Math.sin(t * 0.3 + i * 7.1) * 0.5 + 0.5)) * W;
            const my = ((Math.cos(t * 0.2 + i * 4.3) * 0.5 + 0.5)) * H;
            const mPulse = Math.sin(t * 3 + i * 2.1) * 0.5 + 0.5;
            gl.beginPath(); gl.arc(mx, my, 0.5 + mPulse, 0, Math.PI*2);
            gl.fillStyle = `rgba(196,30,42,${intensity * mPulse * 0.1})`;
            gl.fill();
        }

        // 7. Horizontal scan sweep — slow moving scan line
        const scanPos = ((t * 0.04) % 1) * H;
        const scanGrad = gl.createLinearGradient(0, scanPos - 15, 0, scanPos + 15);
        scanGrad.addColorStop(0, 'rgba(196,30,42,0)');
        scanGrad.addColorStop(0.5, `rgba(196,30,42,${intensity * 0.03})`);
        scanGrad.addColorStop(1, 'rgba(196,30,42,0)');
        gl.fillStyle = scanGrad;
        gl.fillRect(0, scanPos - 15, W, 30);
    }

    // ─── ANIMATED TEXT REVEAL — letter by letter with correct .Ai coloring ───
    function drawTextReveal(text, cx, cy, fontSize, alpha, revealProgress) {
        gl.font = `300 ${fontSize}px Inter, sans-serif`;
        gl.textAlign = 'left';
        gl.textBaseline = 'middle';
        const fullWidth = gl.measureText(text).width;
        const charCount = text.length;
        const revealedChars = Math.floor(revealProgress * charCount);
        const dotIndex = text.indexOf('.');

        let xPos = cx - fullWidth / 2;
        for (let i = 0; i < charCount; i++) {
            const ch = text[i];
            const cw = gl.measureText(ch).width;
            const charCx = xPos + cw / 2;

            if (i < revealedChars) {
                const charAge = (revealProgress * charCount - i) / charCount;
                const charAlpha = clamp(charAge * 8);

                // Character glow burst on reveal
                if (charAge < 0.2) {
                    const glowA = (1 - charAge / 0.2) * alpha;
                    const cg = gl.createRadialGradient(charCx, cy, 0, charCx, cy, fontSize * 1.2);
                    cg.addColorStop(0, `rgba(196,30,42,${glowA * 0.2})`);
                    cg.addColorStop(1, 'rgba(196,30,42,0)');
                    gl.fillStyle = cg;
                    gl.fillRect(charCx - fontSize*1.2, cy - fontSize*1.2, fontSize*2.4, fontSize*2.4);
                }

                gl.font = `300 ${fontSize}px Inter, sans-serif`;
                gl.textAlign = 'left';
                gl.textBaseline = 'middle';
                // Color everything from the dot onward in red
                if (dotIndex >= 0 && i >= dotIndex) {
                    gl.fillStyle = `rgba(196,30,42,${alpha * charAlpha})`;
                } else {
                    gl.fillStyle = `rgba(245,245,247,${alpha * charAlpha * 0.9})`;
                }
                gl.fillText(ch, xPos, cy);

                // Spark between chars during reveal
                if (i < revealedChars - 1 && charAge < 0.3) {
                    const sparkA = (1 - charAge / 0.3) * alpha * 0.15;
                    gl.beginPath();
                    gl.moveTo(xPos + cw, cy);
                    gl.lineTo(xPos + cw + 3, cy + (Math.sin(frame*0.3+i)*3));
                    gl.strokeStyle = `rgba(196,30,42,${sparkA})`;
                    gl.lineWidth = 0.5;
                    gl.stroke();
                }
            } else if (i === revealedChars) {
                // Typing cursor / spark
                const sparkPulse = Math.sin(frame * 0.2) * 0.5 + 0.5;
                const sparkR = 4 + sparkPulse * 3;
                gl.beginPath(); gl.arc(charCx, cy, sparkR, 0, Math.PI * 2);
                gl.fillStyle = `rgba(196,30,42,${alpha * 0.7})`;
                gl.fill();
                // Glow around cursor
                const sg = gl.createRadialGradient(charCx, cy, 0, charCx, cy, 30);
                sg.addColorStop(0, `rgba(196,30,42,${alpha * 0.25})`);
                sg.addColorStop(1, 'rgba(196,30,42,0)');
                gl.fillStyle = sg;
                gl.fillRect(charCx - 30, cy - 30, 60, 60);
                // Electric tendrils from cursor
                for (let tt = 0; tt < 4; tt++) {
                    const ang = (frame * 0.05 + tt * Math.PI/2);
                    const tLen = 10 + sparkPulse * 15;
                    gl.beginPath();
                    gl.moveTo(charCx, cy);
                    gl.lineTo(charCx + Math.cos(ang)*tLen, cy + Math.sin(ang)*tLen);
                    gl.strokeStyle = `rgba(196,30,42,${alpha * 0.12})`;
                    gl.lineWidth = 0.5;
                    gl.stroke();
                }
            }
            xPos += cw;
        }
    }

    // ─── VOICE WAVEFORM — Full screen sine wave ───
    function drawWaveform(alpha, t, intensity) {
        const layers = 5;
        for (let l = 0; l < layers; l++) {
            const la = alpha * (1 - l * 0.18);
            const yOff = H * 0.5;
            gl.beginPath();
            for (let x = 0; x < W; x += 2) {
                const nx2 = x / W;
                const wave = Math.sin(nx2 * 8 + t * 3 + l * 0.5) *
                    Math.sin(nx2 * 3.7 + t * 1.3) *
                    Math.sin(nx2 * 12 + t * 5 + l) * 0.3 +
                    Math.sin(nx2 * 5 + t * 2.1 + l * 0.3) * 0.5;
                const env = Math.sin(nx2 * Math.PI);
                const y = yOff + wave * env * H * 0.3 * intensity;
                x === 0 ? gl.moveTo(x, y) : gl.lineTo(x, y);
            }
            gl.strokeStyle = l === 0
                ? `rgba(196,30,42,${la * 0.7})`
                : `rgba(196,30,42,${la * 0.15})`;
            gl.lineWidth = l === 0 ? 2 : 1;
            gl.stroke();
        }
    }

    // ─── SONAR RINGS ───
    const sonarRings = [];
    function emitSonar(cx2, cy2) {
        sonarRings.push({ x: cx2, y: cy2, r: 0, life: 0, maxR: Math.max(W,H)*0.6 });
    }
    function updateSonar(alpha) {
        for (let i = sonarRings.length - 1; i >= 0; i--) {
            const s2 = sonarRings[i];
            s2.r += 3;
            s2.life += 0.015;
            if (s2.life >= 1) { sonarRings.splice(i, 1); continue; }
            const a2 = (1 - s2.life) * alpha;
            gl.beginPath();
            gl.arc(s2.x, s2.y, s2.r, 0, Math.PI * 2);
            gl.strokeStyle = `rgba(196,30,42,${a2 * 0.4})`;
            gl.lineWidth = 1.5 * (1 - s2.life);
            gl.stroke();
        }
    }

    // ─── DATA RAIN ───
    const DR = 300;
    const drx=new Float32Array(DR), dry=new Float32Array(DR),
          drs=new Float32Array(DR), drl=new Float32Array(DR);
    for(let i=0;i<DR;i++){
        drx[i]=Math.random()*1.2-.1; dry[i]=Math.random();
        drs[i]=.003+Math.random()*.008; drl[i]=.02+Math.random()*.06;
    }
    function drawDataRain(alpha) {
        const chars = '01アドレクティブAI自動化成長';
        for(let i=0;i<DR;i++){
            dry[i]+=drs[i];
            if(dry[i]>1.1){dry[i]=-.05;drx[i]=Math.random()*1.2-.1;}
            const x=drx[i]*W, y=dry[i]*H;
            const a2 = alpha * (0.15 + Math.sin(i + dry[i] * 10) * 0.1);
            gl.font = '11px monospace';
            gl.fillStyle = i%7===0
                ? `rgba(196,30,42,${a2 * 1.5})`
                : `rgba(245,245,247,${a2})`;
            gl.fillText(chars[Math.floor(Math.random()*chars.length)], x, y);
        }
    }

    // ─── SCANNING LINE ───
    function drawScanLine(y, alpha) {
        const grad = gl.createLinearGradient(0, y-30, 0, y+30);
        grad.addColorStop(0, 'rgba(196,30,42,0)');
        grad.addColorStop(0.5, `rgba(196,30,42,${alpha * 0.2})`);
        grad.addColorStop(1, 'rgba(196,30,42,0)');
        gl.fillStyle = grad;
        gl.fillRect(0, y-30, W, 60);
        gl.beginPath();
        gl.moveTo(0, y); gl.lineTo(W, y);
        gl.strokeStyle = `rgba(196,30,42,${alpha * 0.5})`;
        gl.lineWidth = 1;
        gl.stroke();
    }

    // ─── FLOW SYSTEM (Call Processing) ───
    function drawProcessFlow(x, y, w, steps, litCount, alpha) {
        const spacing = w / (steps.length - 1);
        for (let i = 0; i < steps.length - 1; i++) {
            const x1 = x + i * spacing, x2 = x + (i+1) * spacing;
            const lit = i < litCount;
            gl.beginPath(); gl.moveTo(x1+30, y); gl.lineTo(x2-30, y);
            gl.strokeStyle = lit
                ? `rgba(196,30,42,${alpha*0.5})`
                : `rgba(50,50,50,${alpha*0.2})`;
            gl.lineWidth = lit ? 1.5 : 0.5;
            gl.stroke();
            if (lit && i === litCount - 1) {
                const px2 = lerp(x1+30, x2-30, (frame*0.02)%1);
                gl.beginPath(); gl.arc(px2, y, 3, 0, Math.PI*2);
                gl.fillStyle = `rgba(196,30,42,${alpha*0.8})`;
                gl.fill();
            }
        }
        steps.forEach((s2, i) => {
            const nx2 = x + i * spacing;
            const lit = i <= litCount;
            gl.beginPath(); gl.arc(nx2, y, 18, 0, Math.PI*2);
            gl.strokeStyle = lit
                ? `rgba(196,30,42,${alpha*0.7})`
                : `rgba(50,50,50,${alpha*0.25})`;
            gl.lineWidth = lit ? 1.5 : 0.5;
            gl.stroke();
            if (lit) {
                gl.beginPath(); gl.arc(nx2, y, 18, 0, Math.PI*2);
                gl.fillStyle = `rgba(196,30,42,${alpha*0.06})`;
                gl.fill();

    function drawLiveChart(x, y, w, h, t, alpha) {
        gl.beginPath();
        for (let i = 0; i <= w; i++) {
            const v = Math.sin(i*0.04+t*2)*0.3 + Math.sin(i*0.02+t*0.7)*0.4 +
                      Math.sin(i*0.08+t*3)*0.15 + 0.5;
            const py2 = y + h - v * h;
            i === 0 ? gl.moveTo(x+i, py2) : gl.lineTo(x+i, py2);
        }
        gl.strokeStyle = `rgba(196,30,42,${alpha*0.6})`;
        gl.lineWidth = 1.5;
        gl.stroke();
        gl.lineTo(x+w, y+h); gl.lineTo(x, y+h); gl.closePath();
        const gf = gl.createLinearGradient(x,y,x,y+h);
        gf.addColorStop(0, `rgba(196,30,42,${alpha*0.08})`);
        gf.addColorStop(1, 'rgba(196,30,42,0)');
        gl.fillStyle = gf;
        gl.fill();
    }

    function drawFunnel(x, y, w, h, stages, squeeze, alpha) {
        stages.forEach((s2, i) => {
            const ratio = 1 - (i / stages.length) * squeeze;
            const sw = w * ratio * s2.w;
            const sy = y + i * (h / stages.length);
            const sh = h / stages.length - 4;
            const intensity = (stages.length - i) / stages.length;
            gl.fillStyle = `rgba(196,30,42,${alpha * intensity * 0.2})`;
            gl.fillRect(x + (w-sw)/2, sy, sw, sh);
            gl.strokeStyle = `rgba(196,30,42,${alpha * intensity * 0.35})`;
            gl.lineWidth = 0.5;
            gl.strokeRect(x + (w-sw)/2, sy, sw, sh);
            gl.font = '9px Inter, sans-serif';
            gl.textAlign = 'center';
            gl.fillStyle = `rgba(245,245,247,${alpha*0.6})`;
            gl.fillText(s2.v, x + w/2, sy + sh/2 + 3);
        });
    }

    // ─── AUDIO ENGINE ───
    let ac = null;
    function initAudio() { ac = new (window.AudioContext || window.webkitAudioContext)(); }

    function bass(t, f, d, v) {
        if(!ac) return;
        const o=ac.createOscillator(), g=ac.createGain();
        o.type='sine'; o.frequency.value=f;
        const now=ac.currentTime+t;
        g.gain.setValueAtTime(0,now);
        g.gain.linearRampToValueAtTime(v,now+.2);
        g.gain.setValueAtTime(v*.8,now+d*.5);
        g.gain.linearRampToValueAtTime(0,now+d);
        o.connect(g); g.connect(ac.destination);
        o.start(now); o.stop(now+d);
    }

    function hum(t, d, f, v) {
        if(!ac) return;
        const o=ac.createOscillator(), g=ac.createGain(), fl=ac.createBiquadFilter();
        o.type='sawtooth'; o.frequency.value=f;
        fl.type='lowpass'; fl.frequency.value=180; fl.Q.value=1;
        const now=ac.currentTime+t;
        g.gain.setValueAtTime(0,now);
        g.gain.linearRampToValueAtTime(v,now+3);
        g.gain.setValueAtTime(v,now+d-3);
        g.gain.linearRampToValueAtTime(0,now+d);
        o.connect(fl); fl.connect(g); g.connect(ac.destination);
        o.start(now); o.stop(now+d);
    }

    function pad(t, d, f, v) {
        if(!ac) return;
        const o1=ac.createOscillator(), o2=ac.createOscillator(),
              g=ac.createGain(), fl=ac.createBiquadFilter();
        o1.type='sine'; o1.frequency.value=f;
        o2.type='sine'; o2.frequency.value=f*1.003;
        fl.type='lowpass'; fl.frequency.value=350;
        const now=ac.currentTime+t;
        g.gain.setValueAtTime(0,now);
        g.gain.linearRampToValueAtTime(v,now+4);
        g.gain.setValueAtTime(v,now+d-4);
        g.gain.linearRampToValueAtTime(0,now+d);
        o1.connect(fl); o2.connect(fl); fl.connect(g); g.connect(ac.destination);
        o1.start(now); o1.stop(now+d); o2.start(now); o2.stop(now+d);
    }

    function crackle(t, d, v) {
        if(!ac) return;
        const buf = ac.createBuffer(1, ac.sampleRate * d, ac.sampleRate);
        const data = buf.getChannelData(0);
        for(let i=0;i<data.length;i++){
            data[i] = (Math.random()*2-1) * v * (Math.random()>0.97?1:0.02) *
                      Math.sin(i/data.length*Math.PI);
        }
        const src=ac.createBufferSource(), g=ac.createGain(),
              fl=ac.createBiquadFilter();
        src.buffer=buf; fl.type='bandpass'; fl.frequency.value=800; fl.Q.value=2;
        g.gain.value=1;
        src.connect(fl); fl.connect(g); g.connect(ac.destination);
        src.start(ac.currentTime+t);
    }

    function scheduleAudio() {
        hum(0, 65, 36, 0.07);
        hum(0, 65, 54, 0.035);
        hum(2, 60, 72, 0.02);

        bass(1, 30, 4, 0.1);
        bass(10, 36, 3, 0.12);
        bass(22, 34, 3, 0.12);
        bass(34, 40, 3, 0.14);
        bass(46, 32, 3.5, 0.14);
        bass(54, 38, 2.5, 0.12);
        bass(60, 28, 5, 0.18);
        bass(68, 26, 3, 0.15);

        for(let i=0;i<25;i++) bass(2+i*2.3, 24, 0.6, 0.05);

        pad(22, 42, 48, 0.05);
        pad(22, 42, 72, 0.03);
        pad(34, 30, 96, 0.02);

        crackle(0.5, 2, 0.3);
        crackle(9, 1.5, 0.2);

        crackle(33, 1.5, 0.2);
        crackle(45, 1, 0.2);
        crackle(59, 2, 0.4);

        if(ac) {
            const o=ac.createOscillator(), g=ac.createGain(), fl=ac.createBiquadFilter();
            o.type='sawtooth';
            o.frequency.setValueAtTime(30, ac.currentTime+55);
            o.frequency.linearRampToValueAtTime(80, ac.currentTime+62);
            fl.type='lowpass'; fl.frequency.value=120;
            g.gain.setValueAtTime(0, ac.currentTime+55);
            g.gain.linearRampToValueAtTime(0.06, ac.currentTime+60);
            g.gain.linearRampToValueAtTime(0, ac.currentTime+63);
            o.connect(fl); fl.connect(g); g.connect(ac.destination);
            o.start(ac.currentTime+55); o.stop(ac.currentTime+63);
        }
    }

    let lastSonar = 0;

    // ─── RENDER ───
    function render(ts) {
        if (!playing) return;
        frame++;
        const t = (ts - t0) / 1000;
        if (t > DUR + 3) {
            playing = false;
            gl.fillStyle = '#000'; gl.fillRect(0,0,W,H);
            hud.classList.remove('active'); hudSub.classList.remove('active');
            playBtn.style.display = 'block'; playBtn.textContent = 'Replay';
            progress.style.width = '0%';
            return;
        }
        progress.style.width = Math.min(100, t/DUR*100) + '%';

        // Scene detection
        let ns = -1;
        for(let i=0;i<S.length;i++) if(t>=S[i].s && t<S[i].e){ ns=i; break; }
        if(ns!==scene){ scene=ns; hud.classList.remove('active'); hudSub.classList.remove('active'); setHud(scene); }

        // Clear
        gl.fillStyle = '#000'; gl.fillRect(0,0,W,H);

        // ─── PERSISTENT BRAIN NET — grows across scenes 0-5 ───
        if (scene >= 0 && scene <= 5) {
            const brainAlpha = clamp(t / 20) * 0.25;
            drawBrainNet(t, brainAlpha);
        }

        // ═══════════════════════════════════════════
        // SCENE 0: AWAKENING — Ultron singularity, AI wakes up
        // ═══════════════════════════════════════════
        if (scene === 0) {
            const p = sp(t, 0);
            const lt = t - S[0].s;
            const a = fadeIO(p, 0, 0.15, 0.88, 0.12);

            // PHASE TIMING:
            // 0-2s:   Absolute dark → single red spark ignites at center
            // 2-5s:   Particles rush INWARD like gravity, neural arcs crackle
            // 5-8s:   Singularity builds, hex grid powers on from center outward
            // 8-10s:  AWAKENING — shockwave blasts outward, AI is born

            // 1. CENTER SINGULARITY SPARK — the seed of consciousness
            const sparkBirth = clamp(lt / 2);
            const sparkPulse = Math.sin(lt * 8) * 0.3 + 0.7;
            const sparkR = 2 + sparkBirth * 6;
            gl.beginPath();
            gl.arc(W/2, H/2, sparkR * sparkPulse, 0, Math.PI * 2);
            gl.fillStyle = `rgba(196,30,42,${a * sparkBirth * 0.9})`;
            gl.fill();
            // Inner white-hot core
            if (sparkBirth > 0.3) {
                gl.beginPath();
                gl.arc(W/2, H/2, sparkR * 0.4 * sparkPulse, 0, Math.PI * 2);
                gl.fillStyle = `rgba(255,200,200,${a * sparkBirth * 0.5 * sparkPulse})`;
                gl.fill();
            }
            // Spark glow radiating outward
            const glowSize = 40 + sparkBirth * 120;
            const sparkGlow = gl.createRadialGradient(W/2, H/2, 0, W/2, H/2, glowSize);
            sparkGlow.addColorStop(0, `rgba(196,30,42,${a * sparkBirth * 0.18 * sparkPulse})`);
            sparkGlow.addColorStop(0.4, `rgba(139,26,26,${a * sparkBirth * 0.06})`);
            sparkGlow.addColorStop(1, 'rgba(0,0,0,0)');
            gl.fillStyle = sparkGlow;
            gl.fillRect(0, 0, W, H);

            // 2. PARTICLES RUSH INWARD — gravitational singularity pull
            const convergePower = clamp((lt - 1.5) / 3);
            const blastPower = clamp((lt - 8) / 1.5);
            for (let i = 0; i < PN; i++) {
                const sx = (px[i] * 0.5 + 0.5) * W;
                const sy = (py[i] * 0.5 + 0.5) * H;
                const dist = Math.hypot(px[i], py[i]);

                if (blastPower > 0) {
                    // BLAST outward at awakening!
                    const blastDir = dist > 0.01 ? 1 : 0;
                    px[i] += (px[i] / (dist + 0.01)) * blastPower * 0.025 * blastDir;
                    py[i] += (py[i] / (dist + 0.01)) * blastPower * 0.025 * blastDir;
                } else {
                    // Pull toward center
                    const pullStr = convergePower * 0.006 / (dist + 0.15);
                    px[i] += -px[i] * pullStr + pvx[i] * (1 - convergePower * 0.8);
                    py[i] += -py[i] * pullStr + pvy[i] * (1 - convergePower * 0.8);
                }
                if(px[i]>1.1) px[i]=-1.1; if(px[i]<-1.1) px[i]=1.1;
                if(py[i]>1.1) py[i]=-1.1; if(py[i]<-1.1) py[i]=1.1;

                const distCenter = Math.hypot(sx - W/2, sy - H/2) / (W * 0.4);
                const pulse = Math.sin(lt * 3 + pph[i]) * 0.5 + 0.5;
                const vis = convergePower > 0.3
                    ? Math.max(0, 1 - distCenter * 0.3) * (0.5 + pulse * 0.5)
                    : Math.max(0, 1 - distCenter) * pulse * convergePower;

                gl.beginPath();
                gl.arc(sx, sy, psz[i] * (0.5 + pulse * 0.5), 0, Math.PI * 2);
                gl.fillStyle = i % 8 === 0
                    ? `rgba(196,30,42,${a * vis * 0.5})`
                    : `rgba(245,245,247,${a * pa[i] * vis})`;
                gl.fill();

                // Speed trails for converging particles
                if (convergePower > 0.2 && dist < 0.8 && blastPower === 0) {
                    const trailLen = convergePower * 12;
                    gl.beginPath();
                    gl.moveTo(sx, sy);
                    gl.lineTo(sx + px[i] * trailLen * W * 0.5, sy + py[i] * trailLen * H * 0.5);
                    gl.strokeStyle = `rgba(196,30,42,${a * vis * 0.15})`;
                    gl.lineWidth = 0.3;
                    gl.stroke();
                }
            }

            // 3. ELECTRIC ARCS — consciousness crackling outward from singularity
            const arcPhase = clamp((lt - 2) / 3);
            if (arcPhase > 0) {
                const arcCount = Math.floor(arcPhase * 12);
                for (let i = 0; i < arcCount; i++) {
                    const angle = (lt * 0.5 + i * Math.PI * 2 / 12);
                    const len = 50 + arcPhase * 200 + Math.sin(lt * 5 + i * 3) * 60;
                    const segments = 6;
                    gl.beginPath();
                    gl.moveTo(W/2, H/2);
                    for (let s = 1; s <= segments; s++) {
                        const st = s / segments;
                        const jitterX = Math.sin(lt * 15 + i * 7 + s * 3) * (25 * st);
                        const jitterY = Math.cos(lt * 13 + i * 5 + s * 4) * (25 * st);
                        gl.lineTo(
                            W/2 + Math.cos(angle) * len * st + jitterX,
                            H/2 + Math.sin(angle) * len * st + jitterY
                        );
                    }
                    const arcFlicker = Math.sin(lt * 12 + i * 4) * 0.5 + 0.5;
                    gl.strokeStyle = `rgba(196,30,42,${a * arcPhase * 0.35 * arcFlicker})`;
                    gl.lineWidth = 0.5 + arcPhase * 1.5 * arcFlicker;
                    gl.stroke();

                    // Spark at arc tip
                    if (arcFlicker > 0.6) {
                        const tipX = W/2 + Math.cos(angle) * len;
                        const tipY = H/2 + Math.sin(angle) * len;
                        gl.beginPath(); gl.arc(tipX, tipY, 2 + arcFlicker * 2, 0, Math.PI*2);
                        gl.fillStyle = `rgba(196,30,42,${a * arcPhase * 0.4})`;
                        gl.fill();
                    }
                }
            }

            // 4. NEURAL CONNECTIONS snapping in from center
            const connA = fade(lt, 3, 4);
            if (connA > 0) {
                for (let i = 0; i < NN; i++) {
                    nx[i] += nvx[i]; ny[i] += nvy[i];
                    if(Math.abs(nx[i])>1) nvx[i]*=-1;
                    if(Math.abs(ny[i])>1) nvy[i]*=-1;
                }
                const maxConns = Math.floor(connA * nConns.length);
                for (let i = 0; i < maxConns; i++) {
                    const [a2, b, d] = nConns[i];
                    const x1 = (nx[a2]*.5+.5)*W, y1 = (ny[a2]*.5+.5)*H;
                    const x2 = (nx[b]*.5+.5)*W, y2 = (ny[b]*.5+.5)*H;
                    const curD = Math.hypot(x1-x2, y1-y2) / W;
                    if (curD > 0.3) continue;
                    const la = (1 - curD / 0.3) * connA * a;
                    gl.beginPath(); gl.moveTo(x1, y1); gl.lineTo(x2, y2);
                    gl.strokeStyle = `rgba(196,30,42,${la * 0.3})`;
                    gl.lineWidth = 0.5 + connA * 0.5;
                    gl.stroke();
                }
                for (let i = 0; i < NN; i++) {
                    const x = (nx[i]*.5+.5)*W, y = (ny[i]*.5+.5)*H;
                    const pulse = Math.sin(lt * 4 + i) * 0.5 + 0.5;
                    const r = 2 + pulse * 2.5;
                    gl.beginPath(); gl.arc(x, y, r, 0, Math.PI*2);
                    gl.fillStyle = `rgba(196,30,42,${connA * a * (0.4 + pulse * 0.5)})`;
                    gl.fill();
                    // Neuron glow
                    const ng = gl.createRadialGradient(x, y, 0, x, y, r * 4);
                    ng.addColorStop(0, `rgba(196,30,42,${connA * a * pulse * 0.08})`);
                    ng.addColorStop(1, 'rgba(196,30,42,0)');
                    gl.fillStyle = ng;
                    gl.fillRect(x - r*4, y - r*4, r*8, r*8);
                }
            }

            // 5. HEX GRID powers on from center outward
            const hexPhase = fade(lt, 4, 4);
            if (hexPhase > 0) {
                drawHexGrid(a * hexPhase * 0.5, lt * 0.5);
            }

            // 6. Scanning line starts after spark
            if (lt > 2) {
                const scanY = ((lt - 2) * 100) % (H + 100) - 50;
                drawScanLine(scanY, a * fade(lt, 2, 2));
            }

            // 7. SINGULARITY GLOW — builds massively over time
            const singGlow = clamp(lt / 6);
            const singPulse = Math.sin(lt * 2) * 0.2 + 0.8;
            const singR = 100 + singGlow * 250;
            const gr = gl.createRadialGradient(W/2, H/2, 0, W/2, H/2, singR);
            gr.addColorStop(0, `rgba(196,30,42,${singGlow * a * 0.15 * singPulse})`);
            gr.addColorStop(0.3, `rgba(139,26,26,${singGlow * a * 0.06 * singPulse})`);
            gr.addColorStop(1, 'rgba(0,0,0,0)');
            gl.fillStyle = gr;
            gl.fillRect(0, 0, W, H);

            // 8. AWAKENING SHOCKWAVE at ~8s — the moment Ultron opens its eyes
            const shockTime = lt - 8;

                const tg = gl.createRadialGradient(W/2, H/2, 0, W/2, H/2, fontSize * 4);
                tg.addColorStop(0, `rgba(196,30,42,${a * 0.05 * breathe})`);
                tg.addColorStop(1, 'rgba(0,0,0,0)');
                gl.fillStyle = tg;
                gl.fillRect(0, 0, W, H);
            }

            // Electromagnetic pulse rings at text completion
            const pulseStart = textStart + textDur + 0.3;
            const pulseAge = lt - pulseStart;
            if (pulseAge > 0 && pulseAge < 2) {
                const pulseAlpha = clamp(pulseAge / 0.3) * clamp(1 - (pulseAge - 0.8) / 1.2);
                for (let ring = 0; ring < 4; ring++) {
                    const rr = pulseAge * W * 0.2 * (1 - ring * 0.15);
                    if (rr <= 0) continue;
                    gl.beginPath();
                    gl.arc(W/2, H/2, rr, 0, Math.PI * 2);
                    gl.strokeStyle = `rgba(196,30,42,${pulseAlpha * a * 0.25 * (1 - ring * 0.25)})`;
                    gl.lineWidth = 2 - ring * 0.4;
                    gl.stroke();
                }
            }

            // Energy arcs radiating from text center
            if (lt > textStart) {
                const arcCount = 6;
                for (let i = 0; i < arcCount; i++) {
                    const ang = (lt * 0.3 + i * Math.PI * 2 / arcCount);
                    const arcLen = 60 + Math.sin(lt * 2 + i) * 30;
                    const arcA = a * 0.1 * clamp((lt - textStart) / 2);
                    gl.beginPath();
                    gl.moveTo(W/2 + Math.cos(ang) * fontSize * 2, H/2 + Math.sin(ang) * fontSize * 0.8);
                    gl.lineTo(W/2 + Math.cos(ang) * (fontSize * 2 + arcLen), H/2 + Math.sin(ang) * (fontSize * 0.8 + arcLen * 0.3));
                    gl.strokeStyle = `rgba(196,30,42,${arcA})`;
                    gl.lineWidth = 0.5;
                    gl.stroke();
                }
            }

            // Tagline fades in after name reveals
            const tagStart = textStart + textDur + 1.5;
            const tagAlpha = fade(lt, tagStart, 1.5) * a;
            if (tagAlpha > 0) {
                const tagSize = Math.floor(fontSize * 0.3);
                gl.font = `200 ${tagSize}px Inter, sans-serif`;
                gl.textAlign = 'center';
                gl.textBaseline = 'middle';
                gl.fillStyle = `rgba(245,245,247,${tagAlpha * 0.5})`;
                gl.fillText('AUTONOMOUS GROWTH. ENGINEERED.', W/2, H/2 + fontSize * 1.0);
            }

            drawAliveLayer(t, a * 0.9);
        }

        // ═══════════════════════════════════════════
        // SCENE 7: CLOSE — Name holds, silence, fade to black
        // ═══════════════════════════════════════════
        else if (scene === 7) {
            const p = sp(t, 7);
            const lt = t - S[7].s;

            // Fading neural network behind
            const netA = fadeO(lt, 0.5, 2.5);
            drawBrainNet(t, netA * 0.25);

            // Subtle hex grid fading
            drawHexGrid(netA * 0.1, lt * 0.3);

            // "Adrective.Ai" — holds then fades
            const nameA = fadeO(lt, 1.5, 2);
            if (nameA > 0) {
                const fontSize = Math.floor(Math.min(W * 0.055, H * 0.09, 72));
                drawStaticName(W/2, H/2 - fontSize * 0.3, fontSize, nameA);

                // Tagline beneath
                const tagSize = Math.floor(fontSize * 0.3);
                gl.font = `200 ${tagSize}px Inter, sans-serif`;
                gl.textAlign = 'center';
                gl.textBaseline = 'middle';
                gl.fillStyle = `rgba(245,245,247,${nameA * 0.4})`;
                gl.fillText('AUTONOMOUS GROWTH. ENGINEERED.', W/2, H/2 + fontSize * 0.7);
            }

            // Founder credit — Jacques Lev
            const creditA = fadeIO(lt, 1.5, 1.5, 3, 1);
            if (creditA > 0) {
                gl.font = '200 10px Inter, sans-serif';
                gl.textAlign = 'center';
                gl.textBaseline = 'middle';
                gl.fillStyle = `rgba(150,150,150,${creditA * 0.35})`;
                gl.fillText('FOUNDED BY JACQUES LEV', W/2, H * 0.72);
            }

            // Fading ambient glow
            const glowA = fadeO(lt, 0.5, 3);
            const gr = gl.createRadialGradient(W/2, H/2, 0, W/2, H/2, 200);
            gr.addColorStop(0, `rgba(196,30,42,${glowA * 0.05})`);
            gr.addColorStop(1, 'rgba(0,0,0,0)');
            gl.fillStyle = gr;
            gl.fillRect(0, 0, W, H);

            // Alive layer fading out
            drawAliveLayer(t, glowA * 0.4);

            // Drifting particles — dying embers
            for (let i = 0; i < 200; i++) {
                px[i] += pvx[i] * 0.2;
                py[i] += pvy[i] * 0.2;
                const sx = (px[i]*.5+.5)*W, sy = (py[i]*.5+.5)*H;
                const pulse = Math.sin(lt * 1.5 + pph[i]) * 0.4 + 0.6;
                gl.beginPath(); gl.arc(sx, sy, psz[i]*0.3*pulse, 0, Math.PI*2);
                gl.fillStyle = `rgba(196,30,42,${glowA * 0.04 * pulse})`;
                gl.fill();
            }

            // Final fade to absolute black
            if (lt > 2.5) {
                const bk = clamp((lt - 2.5) / 1.5);
                gl.fillStyle = `rgba(0,0,0,${bk})`;
                gl.fillRect(0, 0, W, H);
            }
        }

        // ─── GLOBAL POST-PROCESSING ───

        // Vignette
        const vig = gl.createRadialGradient(W/2,H/2,W*0.25,W/2,H/2,W*0.75);
        vig.addColorStop(0, 'rgba(0,0,0,0)');
        vig.addColorStop(1, 'rgba(0,0,0,0.5)');
        gl.fillStyle = vig;
        gl.fillRect(0, 0, W, H);

        // Scan lines (CRT feel)
        gl.fillStyle = 'rgba(0,0,0,0.03)';
        for (let y = 0; y < H; y += 3) {
            gl.fillRect(0, y, W, 1);
        }

        // Film grain
        for (let i = 0; i < 1200; i++) {
            gl.fillStyle = `rgba(255,255,255,${Math.random()*0.012})`;
            gl.fillRect(Math.random()*W, Math.random()*H, 1, 1);
        }

        requestAnimationFrame(render);
    }

    // ─── START ───
    playBtn.addEventListener('click', () => {
        playBtn.style.display = 'none';
        playing = true; scene = -1; frame = 0; lastSonar = 0;
        t0 = performance.now();
        for(let i=0;i<PN;i++){
            px[i]=Math.random()*2-1; py[i]=Math.random()*2-1;
        }
        sonarRings.length = 0;
        initAudio(); scheduleAudio();
        requestAnimationFrame(render);
    });

    gl.fillStyle='#000'; gl.fillRect(0,0,W,H);
})();
</script>
